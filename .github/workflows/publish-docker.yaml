# Reusable workflow to build and publish container images.

name: Publish Docker Images

on:
  workflow_call:
    inputs:
      stage:
        description: "Stage to build for (for example: dev or release)"
        required: true
        type: string
      tag_suffix:
        description: "Optional suffix to append as a separate tag for dev builds"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  FE_IMAGE_NAME: onedollar-frontend
  BE_IMAGE_NAME: onedollar-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Assemble tags (for PRs it's :dev and :pr-<pull-request-number>)
      - name: Compose image tags
        id: tags
        shell: bash
        run: |
          FE_BASE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.FE_IMAGE_NAME }}"
          BE_BASE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BE_IMAGE_NAME }}"

          case "${{ inputs.stage }}" in
            dev)
              FE_TAGS="$FE_BASE:dev"
              BE_TAGS="$BE_BASE:dev"

              if [ -n "${{ inputs.tag_suffix }}" ]; then
                FE_TAGS="$FE_TAGS,$FE_BASE:${{ inputs.tag_suffix }}"
                BE_TAGS="$BE_TAGS,$BE_BASE:${{ inputs.tag_suffix }}"
              else
                FE_TAGS="$FE_TAGS,$FE_BASE:pr-${{ github.event.number }}"
                BE_TAGS="$BE_TAGS,$BE_BASE:pr-${{ github.event.number }}"
              fi
              ;;
            release)
              FE_TAGS="$FE_BASE:release"
              BE_TAGS="$BE_BASE:release"
              ;;
            *)
              echo "Unsupported stage: ${{ inputs.stage }}"
              exit 1
              ;;
          esac

          echo "fe_tags=$FE_TAGS" >> "$GITHUB_OUTPUT"
          echo "be_tags=$BE_TAGS" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        id: push-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./src/OneDollar.ReactFrontend
          file: ./src/OneDollar.ReactFrontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.fe_tags }}

      - name: Build and Push Backend image
        id: push-backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/OneDollar.AspNetCoreBackend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.be_tags }}
